name: Zeno Store CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck and Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/zeno_store?schema=public
      AUTH_SECRET: ci-build-secret-do-not-use-in-production
      ADMIN_EMAIL: admin@zenostore.com
      ADMIN_PASSWORD: ci-build-password-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Next.js production build
        run: npm run build
